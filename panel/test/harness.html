<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --primary-color:#03a9f4; --primary-background-color:#fafafa; --card-background-color:#fff; --primary-text-color:#212121; --secondary-text-color:#727272; --divider-color:#e0e0e0; --secondary-background-color:#e5e5e5; --text-primary-color:#fff; --success-color:#43a047; --error-color:#db4437; --warning-color:#ffa600; }
  :root.dark { --primary-color:#03a9f4; --primary-background-color:#111111; --card-background-color:#1c1c1c; --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; --divider-color:#3b3b3b; --secondary-background-color:#202b36; --text-primary-color:#fff; --error-color:#e57373; }
  body { margin: 0; background: var(--primary-background-color); font-family: Roboto, Arial, sans-serif; }
</style></head>
<body>
<script type="module" src="/panel.js"></script>
<script type="module">
  // Stand-in for Home Assistant: answers the panel's WebSocket commands and records every call.
  const q = new URLSearchParams(location.search);
  if (q.get("dark")) document.documentElement.classList.add("dark");
  // Home Assistant's own ha-icon is not here: a stand-in that draws a placeholder glyph
  customElements.define("ha-icon", class extends HTMLElement {
    set icon(v) { this._i = v; this.render(); } get icon() { return this._i; }
    connectedCallback() { this.render(); }
    render() { this.innerHTML = `<svg viewBox="0 0 24 24" style="width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);fill:none;stroke:currentColor;stroke-width:1.6"><rect x="3" y="7" width="18" height="10" rx="3"/><path d="M6 17v2M18 17v2M6 7V5h12v2"/></svg>`; }
  });
  const S = window.__s = { calls: [], saves: [], fail: q.get("fail"), notFirst: !!q.get("notfirst"), noMatter: !!q.get("nomatter") };
  const areas = [
    { id: "salon", name: "Salon", floor: "RDC", icon: "mdi:sofa-outline", devices: 31, services: 0, entities: 7 }, { id: "cuisine", name: "Cuisine", floor: "RDC", icon: "mdi:fridge-outline", devices: 8, services: 0, entities: 3 },
    { id: "entree", name: "Entrée", floor: "RDC", icon: "mdi:door-closed", devices: 8, services: 1, entities: 3 },
    { id: "chambre", name: "Chambre à coucher", floor: "Étage", icon: "mdi:bed-king-outline", devices: 45, services: 0, entities: 4 }, { id: "bureau", name: "Bureau", floor: "Étage", icon: null, devices: 1, services: 0, entities: 0 }, { id: "cave", name: "Cave", floor: null, icon: null, devices: 0, services: 0, entities: 0 },
  ];
  const RTG = { sleeping: ["bedroom", "master_bedroom", "child_bedroom", "nursery", "guest_room"], living: ["living_room", "dining_room", "game_room", "home_cinema", "gym"], work: ["office", "workshop"], water: ["bathroom", "toilet"], service: ["kitchen", "pantry", "laundry", "utility_room", "dressing", "storage", "cellar", "attic"], circulation: ["hallway", "entrance", "staircase"] };
  let options = { zones: [], connections: [], excluded_areas: [], layout: {}, room_types: {} };
  if (q.get("legacy")) options = { zones: [], connections: [{ id: "c1", a: "area:salon", b: "area:cuisine", separations: [{ id: "s1", type: "door", sensor: "binary_sensor.porte" }] }], excluded_areas: [], layout: {} };
  const seed = (id, name, areas, extra = {}) => ({ id, name, level: null, icon: null, areas, aliases: [], temperature: { mode: "none", entities: [] }, humidity: { mode: "none", entities: [] }, ...extra });
  if (q.get("groups")) options.groups = [
    seed("nuit", "Night", ["chambre", "bureau"], { icon: "mdi:bed", aliases: ["Nuit"] }), seed("jour", "Day", ["salon", "cuisine", "chambre"]), seed("vide", "Empty", [])];
  S.options = options; S.groupSaves = [];
  const SENSORS = {
    temperature: [["salon", "sensor.salon_temp", "Salon temperature", "21", "°C"], ["chambre", "sensor.chambre_temp", "Chambre temperature", "19", "°C"], ["bureau", "sensor.bureau_temp", "Bureau temperature", "68", "°F"]],
    humidity: [["chambre", "sensor.chambre_hum", "Chambre humidity", "55", "%"], ["bureau", "sensor.bureau_hum", "Bureau humidity", "45", "%"]],
  };
  const kinds = ["garden", "balcony", "terrace", "courtyard", "garage", "hall", "stairwell", "common_area", "street", "neighbor", "other"];
  const inHome = { garden: true, balcony: true, terrace: true, courtyard: false, garage: true, hall: false, stairwell: false, common_area: false, street: false, neighbor: false, other: false };
  // ---- the Rooms page: a small stateful stand-in for the sensors, their exposure, their rooms, their order and the history
  const mk = (id, name, cls, st, unit, area, extra = {}) => ({ entity_id: id, name, state: st, unit, domain: "sensor", type: cls, area_id: area, device_id: null, device_name: null, assist: false, alexa: false, google: false, homekit: [], matter: [], hidden: null, ...extra });
  S.sensors = [mk("sensor.salon_temp", "Salon temperature", "temperature", "21", "°C", "salon", { assist: true, homekit: ["Bridge"], device_id: "dev1", device_name: "Thermo" }),
    mk("sensor.salon_temp2", "Salon temperature 2", "temperature", "22", "°C", "salon", { matter: q.get("nomatter") ? [] : ["Hub"] }),
    mk("sensor.salon_hum", "Salon humidity", "humidity", "50", "%", "salon", { device_id: "dev1", device_name: "Thermo" }), mk("sensor.loose", "Loose sensor", "illuminance", "3", null, null),
    mk("sensor.salon_angle", "Salon angle x", "other", "12", "°", "salon", { hidden: "other" }), mk("binary_sensor.salon_bark_sound", "Salon bark sound", "sound", "off", null, "salon", { domain: "binary_sensor", hidden: "sound" })];
  S.chosen = {}; S.sync = true;
  S.saved = {}; S.history = []; S.hid = 0; S.writes = [];
  if (q.get("notfirst")) { S.sensors[0].assist = false; S.sensors[1].assist = true; S.saved["salon"] = { "sensor.temperature": ["sensor.salon_temp", "sensor.salon_temp2"] }; }
  const stamp = (e) => { const x = { id: "h" + ++S.hid, time: "2026-10-24T20:00:00", undone: false, ...e }; S.history.unshift(x); return x; };
  const groupsOf = (area) => {
    const by = {}; S.sensors.filter((x) => x.area_id === area).forEach((x) => (by[x.domain + "." + x.type] ||= []).push(x));
    return Object.entries(by).map(([key, items]) => {
      const saved = S.saved[area]?.[key];
      items.sort((x, y) => (saved ? saved.indexOf(x.entity_id) - saved.indexOf(y.entity_id) : (y.assist - x.assist) || x.name.localeCompare(y.name)));
      const ordered = items.length >= 2, exp = items.some((x) => x.assist);
      const pick = S.chosen[area]?.[key]; const first = items.find((x) => x.assist);
      return { key, type: key.split(".")[1], domain: items[0].domain, sensors: items, ordered, saved: !!saved && ordered, assist_first: ordered && exp ? items[0].assist : null,
        primary: pick ? pick : first ? first.entity_id : null, primary_source: pick ? (S.sync && /temperature|humidity/.test(key) ? "native" : "chosen") : first ? "assist" : null };
    });
  };
  const R = {
    room_sensors: () => ({ rooms: [{ id: "area:salon", area_id: "salon", name: "Salon", kind: "room", occupants: ["u2"], floor: "Ground floor", floor_level: 0, types: groupsOf("salon") }, { id: "area:cuisine", area_id: "cuisine", name: "Cuisine", kind: "room", occupants: [], floor: "First floor", floor_level: 1, types: groupsOf("cuisine") }],
      unassigned: S.sensors.filter((x) => !x.area_id), primary_sync: S.sync, homekit: [{ title: "Bridge", mode: "bridge" }], assistants: { alexa: !!q.get("alexa"), google: !!q.get("alexa") }, matter: { available: !q.get("nomatter"), bridges: q.get("nomatter") ? [] : ["Hub"] } }),
    exposure_set: (m) => { if (q.get("failwrite")) throw { code: "changed_since", message: "x" }; const x = S.sensors.find((y) => y.entity_id === m.entity_id); const [k, v] = Object.entries(m.changes)[0]; const f = k === "conversation" ? "assist" : k;
      const before = { [k]: x[f] }; x[f] = v; S.writes.push(["exposure", m.entity_id, k, v]); return stamp({ kind: "exposure", entity_id: m.entity_id, before, after: { [k]: v } }); },
    move_preview: (m) => { const x = S.sensors.find((y) => y.entity_id === m.entity_id); const dev = x.device_id ? { id: "dev1", name: "Thermo", area_id: "salon", others: S.sensors.filter((y) => y.device_id === "dev1" && y !== x).map((y) => ({ entity_id: y.entity_id, name: y.name, area_id: y.area_id })) } : null;
      const none = { automation: [], script: [], scene: [] };
      return { entity_id: m.entity_id, area_id: x.area_id, own_area: null, target_area: m.area_id, device: dev, sensor: x.entity_id === "sensor.salon_temp" ? { ...none, automation: [{ entity_id: "automation.cold", name: "Cold alert" }] } : none, device_refs: dev ? { ...none, script: [{ entity_id: "script.warm", name: "Warm up" }] } : null }; },
    move_apply: (m) => { const x = S.sensors.find((y) => y.entity_id === m.entity_id); const before = { area: x.area_id }; const moved = m.scope === "device" ? S.sensors.filter((y) => y.device_id === x.device_id) : [x];
      moved.forEach((y) => (y.area_id = m.area_id)); S.writes.push(["move", m.entity_id, m.area_id, m.scope]); return stamp({ kind: "move", entity_id: m.entity_id, scope: m.scope, area_id: m.area_id, before, after: { area: m.area_id } }); },
    save_order: (m) => { S.writes.push(["order", m.area_id, m.key, m.entity_ids]); if (m.entity_ids.length) (S.saved[m.area_id] ||= {})[m.key] = m.entity_ids; else if (S.saved[m.area_id]) delete S.saved[m.area_id][m.key]; return {}; },
    primary_set: (m) => { const before = { chosen: S.chosen[m.area_id]?.[m.key] ?? null }; if (m.entity_id) (S.chosen[m.area_id] ||= {})[m.key] = m.entity_id; else delete (S.chosen[m.area_id] || {})[m.key];
      S.writes.push(["primary", m.area_id, m.key, m.entity_id]); return stamp({ kind: "primary", entity_id: m.entity_id || before.chosen, area_id: m.area_id, key: m.key, before, after: { chosen: m.entity_id } }); },
    primary_sync: (m) => { S.sync = m.value; S.writes.push(["sync", m.value]); return { primary_sync: m.value }; },
    history: () => ({ entries: S.history }),
    undo: (m) => { const e = S.history.find((x) => x.id === m.entry_id); e.undone = true; if (e.kind === "exposure") { const [k, v] = Object.entries(e.before)[0]; S.sensors.find((y) => y.entity_id === e.entity_id)[k === "conversation" ? "assist" : k] = v; } S.writes.push(["undo", e.id]); return e; },
  };
  const hass = {
    language: q.get("lang") || "en",
    states: { "binary_sensor.porte": { state: "off", attributes: {} }, "cover.volet": { state: "open", attributes: { current_position: 40 } } },
    async callWS(msg) {
      S.calls.push(msg.type);
      if (msg.type === "home_structure/get") return { areas, users: S.users ?? [{ id: "u1", name: "Amal" }, { id: "u2", name: "Karim" }], options: JSON.parse(JSON.stringify(S.options)), kinds, types: ["open_space", "opening", "door", "glass_door", "grille", "window", "shutter", "wall"], in_home: inHome, permanent: { open_space: "open", opening: "open", wall: "closed" }, sensor_domains: ["binary_sensor", "cover"], shutter_hosts: ["door", "glass_door", "window"], lock_hosts: ["door", "glass_door", "grille"], passage_levels: ["none", "possible", "normal"], passage_by_type: { open_space: "normal", opening: "normal", door: "normal", glass_door: "normal", grille: "normal", window: "possible", shutter: "possible", wall: "none" }, passage_ambiguous: ["grille", "window", "shutter"], room_type_groups: RTG, room_types: Object.values(RTG).flat() };
      if (msg.type.startsWith("home_structure/") && R[msg.type.slice(15)]) return R[msg.type.slice(15)](msg);
      if (msg.type === "home_structure/save") {
        if (S.fail === "save") throw { message: "boom" };
        S.options = JSON.parse(JSON.stringify(msg.options)); S.saves.push(S.options);
        return { options: S.options, rebuilt: true };
      }
      if (msg.type === "home_structure/save_groups") {
        if (S.fail === "groups") throw { message: "nope" };
        const taken = new Set(); const groups = JSON.parse(JSON.stringify(msg.groups));
        groups.forEach((g) => { if (!g.id) g.id = g.name.toLowerCase().replace(/[^a-z0-9]+/g, "_"); taken.add(g.id); });
        S.groupSaves.push(groups); S.options.groups = groups;
        return { groups, pruned: S.prune ? ["nuit"] : [], rebuilt: true };
      }
      if (msg.type === "home_structure/group_sensors") return { sensors: SENSORS[msg.kind].filter((s) => msg.area_ids.includes(s[0])).map((s) => ({ entity_id: s[1], name: s[2], state: s[3], unit: s[4], area_id: s[0], area: areas.find((a) => a.id === s[0]).name })) };
      if (msg.type === "home_structure/candidates") return { sensors: [{ entity_id: "binary_sensor.porte", name: "Porte", state: "off" }, { entity_id: "cover.volet", name: "Volet", state: "open" }], filtered: true, locks: [{ entity_id: "lock.porte", name: "Serrure", state: "locked" }], locks_filtered: true };
      throw new Error("unknown " + msg.type);
    },
  };
  window.__hass = hass;
  const el = document.createElement("home-structure-panel");
  el.hass = hass; el.narrow = q.get("narrow") === "1";
  document.body.append(el);
  window.__panel = el;
</script>
