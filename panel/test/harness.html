<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --primary-color:#03a9f4; --primary-background-color:#fafafa; --card-background-color:#fff; --primary-text-color:#212121; --secondary-text-color:#727272; --divider-color:#e0e0e0; --secondary-background-color:#e5e5e5; --text-primary-color:#fff; --success-color:#43a047; --error-color:#db4437; --warning-color:#ffa600; }
  :root.dark { --primary-color:#03a9f4; --primary-background-color:#111111; --card-background-color:#1c1c1c; --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; --divider-color:#3b3b3b; --secondary-background-color:#202b36; --text-primary-color:#fff; --error-color:#e57373; }
  body { margin: 0; background: var(--primary-background-color); font-family: Roboto, Arial, sans-serif; }
</style></head>
<body>
<script type="module" src="/panel.js"></script>
<script type="module">
  // Stand-in for Home Assistant: answers the panel's WebSocket commands and records every call.
  const q = new URLSearchParams(location.search);
  if (q.get("dark")) document.documentElement.classList.add("dark");
  // Home Assistant's own ha-icon is not here: a stand-in that draws a placeholder glyph
  customElements.define("ha-icon", class extends HTMLElement {
    set icon(v) { this._i = v; this.render(); } get icon() { return this._i; }
    connectedCallback() { this.render(); }
    render() { this.innerHTML = `<svg viewBox="0 0 24 24" style="width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);fill:none;stroke:currentColor;stroke-width:1.6"><rect x="3" y="7" width="18" height="10" rx="3"/><path d="M6 17v2M18 17v2M6 7V5h12v2"/></svg>`; }
  });
  const S = window.__s = { calls: [], saves: [], fail: q.get("fail") };
  const areas = [
    { id: "salon", name: "Salon", floor: "RDC", icon: "mdi:sofa-outline", devices: 31, services: 0, entities: 7 }, { id: "cuisine", name: "Cuisine", floor: "RDC", icon: "mdi:fridge-outline", devices: 8, services: 0, entities: 3 },
    { id: "entree", name: "Entrée", floor: "RDC", icon: "mdi:door-closed", devices: 8, services: 1, entities: 3 },
    { id: "chambre", name: "Chambre à coucher", floor: "Étage", icon: "mdi:bed-king-outline", devices: 45, services: 0, entities: 4 }, { id: "bureau", name: "Bureau", floor: "Étage", icon: null, devices: 1, services: 0, entities: 0 }, { id: "cave", name: "Cave", floor: null, icon: null, devices: 0, services: 0, entities: 0 },
  ];
  const RTG = { sleeping: ["bedroom", "master_bedroom", "child_bedroom", "nursery", "guest_room"], living: ["living_room", "dining_room", "game_room", "home_cinema", "gym"], work: ["office", "workshop"], water: ["bathroom", "toilet"], service: ["kitchen", "pantry", "laundry", "utility_room", "dressing", "storage", "cellar", "attic"], circulation: ["hallway", "entrance", "staircase"] };
  let options = { zones: [], connections: [], excluded_areas: [], layout: {}, room_types: {} };
  if (q.get("legacy")) options = { zones: [], connections: [{ id: "c1", a: "area:salon", b: "area:cuisine", separations: [{ id: "s1", type: "door", sensor: "binary_sensor.porte" }] }], excluded_areas: [], layout: {} };
  const seed = (id, name, areas, extra = {}) => ({ id, name, level: null, icon: null, areas, aliases: [], temperature: { mode: "none", entities: [] }, humidity: { mode: "none", entities: [] }, ...extra });
  if (q.get("groups")) options.groups = [
    seed("nuit", "Night", ["chambre", "bureau"], { icon: "mdi:bed", aliases: ["Nuit"] }), seed("jour", "Day", ["salon", "cuisine", "chambre"]), seed("vide", "Empty", [])];
  S.options = options; S.groupSaves = [];
  const SENSORS = {
    temperature: [["salon", "sensor.salon_temp", "Salon temperature", "21", "°C"], ["chambre", "sensor.chambre_temp", "Chambre temperature", "19", "°C"], ["bureau", "sensor.bureau_temp", "Bureau temperature", "68", "°F"]],
    humidity: [["chambre", "sensor.chambre_hum", "Chambre humidity", "55", "%"], ["bureau", "sensor.bureau_hum", "Bureau humidity", "45", "%"]],
  };
  const kinds = ["garden", "balcony", "terrace", "courtyard", "garage", "hall", "stairwell", "common_area", "street", "neighbor", "other"];
  const inHome = { garden: true, balcony: true, terrace: true, courtyard: false, garage: true, hall: false, stairwell: false, common_area: false, street: false, neighbor: false, other: false };
  const hass = {
    language: q.get("lang") || "en",
    states: { "binary_sensor.porte": { state: "off", attributes: {} }, "cover.volet": { state: "open", attributes: { current_position: 40 } } },
    async callWS(msg) {
      S.calls.push(msg.type);
      if (msg.type === "home_structure/get") return { areas, options: JSON.parse(JSON.stringify(S.options)), kinds, types: ["open_space", "opening", "door", "glass_door", "grille", "window", "shutter", "wall"], in_home: inHome, permanent: { open_space: "open", opening: "open", wall: "closed" }, sensor_domains: ["binary_sensor", "cover"], shutter_hosts: ["door", "glass_door", "window"], room_type_groups: RTG, room_types: Object.values(RTG).flat() };
      if (msg.type === "home_structure/save") {
        if (S.fail === "save") throw { message: "boom" };
        S.options = JSON.parse(JSON.stringify(msg.options)); S.saves.push(S.options);
        return { options: S.options, rebuilt: true };
      }
      if (msg.type === "home_structure/save_groups") {
        if (S.fail === "groups") throw { message: "nope" };
        const taken = new Set(); const groups = JSON.parse(JSON.stringify(msg.groups));
        groups.forEach((g) => { if (!g.id) g.id = g.name.toLowerCase().replace(/[^a-z0-9]+/g, "_"); taken.add(g.id); });
        S.groupSaves.push(groups); S.options.groups = groups;
        return { groups, pruned: S.prune ? ["nuit"] : [], rebuilt: true };
      }
      if (msg.type === "home_structure/group_sensors") return { sensors: SENSORS[msg.kind].filter((s) => msg.area_ids.includes(s[0])).map((s) => ({ entity_id: s[1], name: s[2], state: s[3], unit: s[4], area_id: s[0], area: areas.find((a) => a.id === s[0]).name })) };
      if (msg.type === "home_structure/candidates") return { sensors: [{ entity_id: "binary_sensor.porte", name: "Porte", state: "off" }, { entity_id: "cover.volet", name: "Volet", state: "open" }], filtered: true };
      throw new Error("unknown " + msg.type);
    },
  };
  window.__hass = hass;
  const el = document.createElement("home-structure-panel");
  el.hass = hass; el.narrow = q.get("narrow") === "1";
  document.body.append(el);
  window.__panel = el;
</script>
</body></html>
